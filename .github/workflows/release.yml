
name: Release to Google Play

on:
  push:
    branches: [dev, master]

env:
  # >>> Put your real production URL here <<<
  BASE_URL: https://api.your-production-domain.com

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # pubspec.yaml lists .env as an asset and main.dart loads it.
      # flutter_dotenv throws on a 0-byte file, so write a comment line.
      - name: Create .env
        run: echo "# created by CI" > .env

      - name: Get Flutter packages
        run: flutter pub get

      # Without this, Gradle doesn't know your app version and uses "1.0"
      - name: Read app version from pubspec.yaml
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//' | tr -d ' \r')
          BUILD_NUMBER=$(grep '^version:' pubspec.yaml | sed -n 's/.*+//p' | tr -d ' \r')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          # Start on a new line: local.properties may not end with a line break
          printf '\nflutter.versionName=%s\nflutter.versionCode=%s\n' "$VERSION_NAME" "${BUILD_NUMBER:-1}" >> android/local.properties
          echo "local.properties now contains:"
          cat android/local.properties
          echo "App version: $VERSION_NAME"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        working-directory: android
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

      - name: Create key.properties
        working-directory: android
        run: |
          cat > key.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          cp key.properties keystore.properties

      - name: Choose Play track and release name from branch
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "TRACK=alpha" >> $GITHUB_ENV   # closed testing; change to production after public launch
            echo "RELEASE_NAME=v${VERSION_NAME}-closed" >> $GITHUB_ENV
          else
            echo "TRACK=internal" >> $GITHUB_ENV
            echo "RELEASE_NAME=v${VERSION_NAME}-internal" >> $GITHUB_ENV
          fi

      - name: Build, sign and upload AAB
        working-directory: android
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
        run: |
          chmod +x gradlew
          # Same as: flutter build --dart-define=BASE_URL=...  (Gradle needs it base64-encoded)
          DART_DEFINES=$(echo -n "BASE_URL=$BASE_URL" | base64 -w0)
          echo "Uploading $RELEASE_NAME to track $TRACK with BASE_URL=$BASE_URL"
          ./gradlew publishReleaseBundle --track $TRACK --release-name "$RELEASE_NAME" -Pdart-defines=$DART_DEFINES