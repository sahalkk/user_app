# Flutter app. Every Play upload uses the PRODUCTION base URL.
#   dev    -> Play "internal" track
#   master -> Play closed testing ("alpha") track

name: Release to Google Play

on:
  push:
    branches: [dev, master]

env:
  # >>> Put your real production URL here <<<
  BASE_URL: https://144.24.146.130

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # pubspec.yaml lists .env as an asset, so it must exist (it can be empty)
      - name: Create empty .env
        run: touch .env

      - name: Get Flutter packages
        run: flutter pub get

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        working-directory: android
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

      - name: Create key.properties
        working-directory: android
        run: |
          cat > key.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          cp key.properties keystore.properties

      - name: Choose Play track from branch
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "TRACK=alpha" >> $GITHUB_ENV   # closed testing; change to production after public launch
          else
            echo "TRACK=internal" >> $GITHUB_ENV
          fi

      - name: Build, sign and upload AAB
        working-directory: android
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
        run: |
          chmod +x gradlew
          # Same as: flutter build --dart-define=BASE_URL=...  (Gradle needs it base64-encoded)
          DART_DEFINES=$(echo -n "BASE_URL=$BASE_URL" | base64 -w0)
          echo "Building for track $TRACK with BASE_URL=$BASE_URL"
          ./gradlew publishReleaseBundle --track $TRACK -Pdart-defines=$DART_DEFINES