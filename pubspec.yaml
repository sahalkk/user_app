name: beeyo_customer  # Was app123
description: Delivery app for Beeyo.
publish_to: "none"
version: 0.1.0+13

environment:
  sdk: ">=3.2.3 <4.0.0"

fonts:
  - family: Poppins
    fonts:
      - asset: assets/fonts/Poppins-Regular.ttf
      - asset: assets/fonts/Poppins-Medium.ttf
      - asset: assets/fonts/Poppins-SemiBold.ttf
      - asset: assets/fonts/Poppins-Bold.ttf
      
dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.0.2

  bloc: ^8.1.4
  flutter_bloc: ^8.1.3
  equatable: ^2.0.7
  http: ^1.3.0

  rxdart: ^0.27.7
  flutter_spinkit: ^5.2.2
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  speech_to_text: ^7.3.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Location / address module
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  change_app_package_name: ^1.4.0
  rename: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - .env
